server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets (JS/CSS/images): serve the real file, otherwise 404.
    # No SPA fallback here on purpose — non-app paths (/bff/*, /api/*,
    # /actuator, ...) must NOT be answered with the React shell. Those are
    # routed to the gateway by the ALB; if one reaches nginx it's a routing
    # miss and should fail honestly with 404, not a misleading 200 + HTML.
    location / {
        try_files $uri $uri/ =404;
    }

    # Client-side routes defined in src/App.tsx: serve index.html so React
    # Router can handle them on refresh / deep-link. Keep this list in sync
    # with the <Route path="..."> entries in App.tsx.
    location ~ ^/(productos|sucursales|bodegas|pedidos|usuarios|roles)/?$ {
        try_files $uri /index.html;
    }

    location = / {
        try_files $uri /index.html;
    }
}
