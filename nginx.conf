server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: client-side routes (/productos, /pedidos, ...) must
    # serve index.html so React Router can handle them on refresh/deep-link.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
